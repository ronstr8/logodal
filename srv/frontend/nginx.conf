# Brand ("skin") for this request, from the Host header. brand.js re-skins the
# page in the browser, but link previewers, crawlers and the pre-JS first paint
# only see the raw HTML, so index.html's brand-specific strings (title, icons,
# manifest, theme colour, og: tags) are rewritten here too.
#
# brand-hosts.conf supplies the `default` and host entries; the Helm chart
# mounts one generated from global.brands, replacing the image's fallback copy.
map $host $brand {
    hostnames;
    include /etc/nginx/brand-hosts.conf;
}

# Per-brand values. Keep in sync with BRANDS in src/brand.js. The defaults are
# the literal strings in index.html, so a Logodal request is a no-op rewrite.
map $brand $brand_name {
    default  Logodal;
    wordwank Wordwank;
}
map $brand $brand_icons {
    default  /.well-known/favicon/;
    wordwank /brands/wordwank/favicon/;
}
map $brand $brand_manifest {
    default  /.well-known/site.webmanifest;
    wordwank /brands/wordwank/site.webmanifest;
}
map $brand $brand_theme {
    default  "#0e0906";
    wordwank "#2c3e50";
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Only touches text/html, i.e. index.html.
        sub_filter_once off;
        sub_filter '<title>Logodal</title>'       '<title>$brand_name</title>';
        sub_filter 'content="Logodal"'            'content="$brand_name"';
        sub_filter 'content="#0e0906"'            'content="$brand_theme"';
        sub_filter '/.well-known/favicon/'        '$brand_icons';
        sub_filter '/.well-known/site.webmanifest' '$brand_manifest';
        # og:image must be absolute; point it at the host that was asked for.
        sub_filter 'https://logodal.com'          'https://$host';
    }

# WebSocket proxy removed – gatewayd service disabled

# Player API proxy removed – Perl backend handles /players
}
