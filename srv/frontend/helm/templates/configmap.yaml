apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: {{ .Values.global.namespace }}
data:
  runtime-config.js: |
    window.LOGODAL_CONFIG = {
      LOG_LEVEL: {{ .Values.global.logLevel | default .Values.logLevel | quote }},
      KOFI_ID: {{ .Values.global.kofiId | default .Values.kofiId | quote }},
      KOFI_ENABLED: {{ .Values.global.kofiEnabled | default .Values.kofiEnabled | default true }},
      PAYPAL_ENABLED: {{ .Values.global.paypalEnabled | default .Values.paypalEnabled | default true }},
      PAYPAL_EMAIL: {{ .Values.global.paypalEmail | default .Values.paypalEmail | quote }},
      PROJECT_CODE_LINK: {{ .Values.global.projectCodeLink | default .Values.projectCodeLink | default "https://github.com/ronstr8/Logodal" | quote }},
      {{- $brands := .Values.global.brands | default dict }}
      {{- $brandHosts := dict }}
      {{- range ($brands.sites | default list) }}
      {{- $_ := set $brandHosts .host .brand }}
      {{- end }}
      DEFAULT_BRAND: {{ $brands.default | default "logodal" | quote }},
      BRAND_HOSTS: {{ $brandHosts | toJson }}
    };
  # Included by nginx.conf's `map $host $brand` (hostnames mode). A leading dot
  # matches the host and its subdomains (www.); the regexes mirror brand.js's
  # "brand as a DNS label" fallback (wordwank.localhost, ...).
  brand-hosts.conf: |
    {{- $brands := .Values.global.brands | default dict }}
    default {{ $brands.default | default "logodal" }};
    {{- $names := dict }}
    {{- range ($brands.sites | default list) }}
    .{{ .host }} {{ .brand }};
    {{- $_ := set $names .brand true }}
    {{- end }}
    {{- range (keys $names | sortAlpha) }}
    ~(^|\.){{ . }}(\.|$) {{ . }};
    {{- end }}

