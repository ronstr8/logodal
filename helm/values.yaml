# Global settings shared across all microservices
global:
  domain: logodal.com
  # The single port for all traffic (Frontend, API, WS)
  externalPort: 80
  registry: localhost:5000
  namespace: logodal
  projectName: "logodal"
  imageTag: 3.0.0
  imagePullPolicy: Always
  maxPlayers: 13
  randomLetterScoreMode: "true"
  gameDuration: 30
  quickBonusSeconds: 10
  uniqueWordBonus: 1
  rackSize: 8
  minVowels: 2
  minConsonants: 2
  logLevel: debug
  defaultLanguage: en
  chatHistorySize: 50
  totalTiles: 100
  kofiId: "logodal"
  kofiEnabled: false
  paypalEnabled: false
  paypalEmail: "quinnfazigu@gmail.com"
  projectCodeLink: "https://github.com/ronstr8/logodal"
  scoreAgainstAI: "true"
  endOnAllPlayed: "true"
  storageClass: "logodal-db-local"
  persistence:
    manualPV: true


# Centralized Ingress configuration
ingress:
  enabled: true
  host: logodal.com
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: logodal-tls

# Subchart overrides
frontend:
  enabled: true
  service:
    type: ClusterIP
    port: 80

wordd:
  enabled: true
  service:
    type: ClusterIP
    port: 2345
  langs: "en,es,fr,de,ru,el"

backend:
  enabled: true
  service:
    port: 3000
  ollama:
    url: "http://ollama.ollama:11434"
    model: "tinyllama:1.1b"
    chat_context_depth: 5
  database:
    url: "dbi:Pg:dbname=logodal;host=postgresql"
    user: "logodal_backend"
  env:
    ADMIN_SMS_EMAIL: "17169032417@tmomail.net"
    CHAT_HISTORY_SIZE: 50
    OLLAMA_URL: "http://ollama.ollama:11434"
    OLLAMA_MODEL: "tinyllama:1.1b"

# PostgreSQL dependency configuration
postgresql:
  enabled: true
  fullnameOverride: postgresql
  image:
    registry: "docker.io"
    repository: "bitnamilegacy/postgresql"
    tag: "16.4.0-debian-12-r0"
  auth:
    database: "logodal"
    username: "logodal_backend"
  primary:
    initdb:
      scriptsConfigMap: db-init
    persistence:
      enabled: true
      size: 10Gi
      storageClass: logodal-db-local
  volumePermissions:
    enabled: true
    image:
      repository: busybox
      tag: 1.36.1

redis:
  enabled: true
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0

