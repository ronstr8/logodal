{{- /*
  Every locale file under share/locale/: base <lang>.json plus brand overlays
  <brand>.<lang>.json. Globbed so new languages and brands ship automatically
  (an explicit list previously left el.json out). `make deploy` copies these
  from srv/frontend/share/locale/, the source of truth.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: logodal-locales
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: logodal
    meta.helm.sh/release-namespace: {{ .Values.global.namespace }}
data:
{{- range $path, $_ := .Files.Glob "share/locale/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
